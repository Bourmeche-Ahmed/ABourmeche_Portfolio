<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#080b0f" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Instrument Panel -->
  <rect x="8" y="8" width="240" height="240" rx="18" fill="url(#panelGrad)" stroke="#273546" stroke-width="3.5" />

  <!-- Corner Calibrated Ticks -->
  <path d="M 22 36 L 22 22 L 36 22" stroke="#f57c00" stroke-width="3" fill="none" stroke-linecap="square" />
  <path d="M 234 36 L 234 22 L 220 22" stroke="#f57c00" stroke-width="3" fill="none" stroke-linecap="square" />
  <path d="M 22 220 L 22 234 L 36 234" stroke="#f57c00" stroke-width="3" fill="none" stroke-linecap="square" />
  <path d="M 234 220 L 234 234 L 220 234" stroke="#f57c00" stroke-width="3" fill="none" stroke-linecap="square" />

  <!-- Grid / Bus Track Lines -->
  <line x1="30" y1="85" x2="226" y2="85" stroke="#1c2430" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="30" y1="171" x2="226" y2="171" stroke="#1c2430" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="85" y1="30" x2="85" y2="226" stroke="#1c2430" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="171" y1="30" x2="171" y2="226" stroke="#1c2430" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Central Radar / Ring -->
  <circle cx="128" cy="128" r="74" stroke="#253342" stroke-width="2" fill="none" />
  <circle cx="128" cy="128" r="60" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="5 6" fill="none" />

  <!-- Nodes -->
  <circle cx="128" cy="54" r="4.5" fill="#f57c00" />
  <circle cx="128" cy="202" r="4.5" fill="#38bdf8" />
  <circle cx="54" cy="128" r="4.5" fill="#38bdf8" />
  <circle cx="202" cy="128" r="4.5" fill="#f57c00" />

  <!-- Monogram AB -->
  <text x="128" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'IBM Plex Sans', sans-serif" font-size="78" font-weight="900" fill="url(#amberGrad)" text-anchor="middle" letter-spacing="1">AB</text>

  <!-- Industrial Sub-indicator Status Bar -->
  <rect x="92" y="168" width="72" height="5" rx="1.5" fill="#38bdf8" opacity="0.9" />
</svg>
